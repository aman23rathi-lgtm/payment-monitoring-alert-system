spring.application.name=payment-monitoring-system

# Activates application-local.properties for local development (gitignored).
# In other environments (CI/prod), override with SPRING_PROFILES_ACTIVE and
# set DB_USERNAME/DB_PASSWORD as real environment variables instead.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=jdbc:mariadb://localhost:3306/payment_monitoring
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Auto-run schema.sql against the configured datasource (creates the alerts
# table if it doesn't already exist).
spring.sql.init.mode=always

# JSP dashboard view resolution
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Failure-rate thresholds (percentage) used by monitoring. Any gateway not
# listed under gateways.* falls back to default-value.
monitoring.threshold.default-value=10
monitoring.threshold.gateways.razorpay=5
monitoring.threshold.gateways.payu=15
monitoring.threshold.gateways.phonepe=10

# How often (in milliseconds) the scheduler re-checks gateway failure rates
monitoring.schedule.rate=300000